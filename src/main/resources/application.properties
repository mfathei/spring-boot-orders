spring.application.name=orders

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/orders?reWriteBatchedInserts=true
spring.datasource.username=postgres
spring.datasource.password=P@ssw0rd

spring.jpa.hibernate.ddl-auto=validate

# Disable Open Session In View (OSIV) to enforce strict transaction boundaries
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable JDBC batching for write performance
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Structured SQL logging with parameter binding (shows actual values instead of '?')
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Ensures Flyway is enabled
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Prevents accidental execution against a production DB if migrations are missing
spring.flyway.fail-on-missing-locations=true
# Clean is dangerous in production; disable it to prevent accidental data wipes
spring.flyway.clean-disabled=true

