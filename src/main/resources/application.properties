spring.application.name=orders

# Default Profile (Active as local for development unless overridden via environment variable)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server Configuration
server.port=${PORT:8080}
server.shutdown=graceful

# Database Configuration (Environment variable overrides with fallbacks)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders?reWriteBatchedInserts=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:P@ssw0rd}

# Connection Pool (HikariCP Production Optimizations)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=OrdersHikariCP

# JPA / Hibernate Production Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

# JDBC Batching Performance Tuning
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Production Logging (Default to INFO to avoid SQL/Trace overhead in production)
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.orders.orders=${LOGGING_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_SQL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${LOGGING_LEVEL_BIND:INFO}

# Flyway Migration Protections
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.fail-on-missing-locations=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true
